# OPS CONTROL - Docker Compose
# Production deployment with future service readiness.
#
# Run:  docker compose up -d
# Stop: docker compose down

version: "3.9"

services:
  bot:
    build: .
    container_name: ops-control-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Persist database and logs outside the container
      - ./data:/app/data
      - ./logs:/app/logs
      # Mount assets so generated images persist
      # Main assets are read-only to protect template files
      - ./assets:/app/assets:ro
      # Generated images need write access
      - ./assets/generated:/app/assets/generated
    environment:
      - DATABASE_PATH=/app/data/ops-control.db
      - LOG_PATH=/app/logs/ops-control.log
      - ASSETS_DIR=/app/assets
      - TZ=${TIMEZONE:-UTC}
      # Moderation / automod (B2)
      - MOD_LOG_CHANNEL_ID=${MOD_LOG_CHANNEL_ID:-}
      - MUTED_ROLE_ID=${MUTED_ROLE_ID:-}
      # VATSIM event reminders (B3)
      - VATSIM_EVENTS_CHANNEL_ID=${VATSIM_EVENTS_CHANNEL_ID:-}
      # Admin API integration (B1 hosted transcripts, C4 appeals)
      - ADMIN_API_BASE_URL=${ADMIN_API_BASE_URL:-https://admin.opsroom.live}
      - ADMIN_API_TOKEN=${ADMIN_API_TOKEN:-}
      - APPEAL_FORM_URL=${APPEAL_FORM_URL:-https://opsroom.live/appeal}
      # Pending action dispatcher
      - PENDING_ACTION_POLL_SECONDS=${PENDING_ACTION_POLL_SECONDS:-15}
      - PENDING_ACTION_MAX_ATTEMPTS=${PENDING_ACTION_MAX_ATTEMPTS:-3}
      # v0.26: roadmap channel + feedback forum (defaults match the server)
      - DISCORD_ROADMAP_CHANNEL_ID=${DISCORD_ROADMAP_CHANNEL_ID:-1538901155583889488}
      - FEEDBACK_FORUM_CHANNEL_ID=${FEEDBACK_FORUM_CHANNEL_ID:-1522234516922433661}

